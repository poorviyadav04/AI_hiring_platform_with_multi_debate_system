[project]
name = "hiring-engine"
version = "1.0.0"
description = "AI-powered hiring platform with multi-agent debate system"
requires-python = ">=3.11"
dependencies = [
    # LLM
    "google-genai>=1.0.0",
    # API
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "python-multipart>=0.0.9",
    # Data
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    # Database
    "supabase>=2.0.0",
    # Vector search
    "sentence-transformers>=2.3.0",
    "faiss-cpu>=1.7.4",
    "numpy>=1.24.0",
    # Graph
    "networkx>=3.2.0",
    # HTTP client (GitHub API)
    "httpx>=0.27.0",
    # PDF parsing
    "pypdf>=4.0.0",
    # Groq (free LLM)
    "groq>=0.11.0",
    # Utilities
    "python-dotenv>=1.0.0",
    "tenacity>=8.2.0",
    "cachetools>=5.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "black>=24.1.0",
    "mypy>=1.8.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.black]
line-length = 100
